name: Transport Test

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  transport-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.5.1
          use-dotnet: false
          include-templates: false

      - name: Run headless leaderboard transport test
        run: bash tests/run_transport_tests.sh
